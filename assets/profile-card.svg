<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm Sugar</title>
  <desc id="description">Sugar's developer profile with a pixel-art green frog.</desc>

  <defs>
    <filter id="small-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17211a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="#ffffff"/>

  <g font-family="Menlo, Monaco, 'Courier New', monospace">
    <text x="54" y="113" fill="#202124" font-size="55" font-weight="700" letter-spacing="0">Hi, I'm <tspan fill="#3d9144">Sugar</tspan></text>
    <text x="57" y="164" fill="#666a70" font-size="20" letter-spacing="0">Code. Learn. Build. Share.</text>

    <g transform="translate(57 212)">
      <path d="M2 0 L13 11 L2 22" fill="none" stroke="#55bd5b" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M17 22 H29" stroke="#55bd5b" stroke-width="3"/>
      <text x="43" y="18" fill="#24282c" font-size="19">A student developer who loves</text>
      <text x="43" y="50" fill="#24282c" font-size="19">building useful things.</text>
    </g>

    <line x1="57" y1="319" x2="564" y2="319" stroke="#e3e6e8" stroke-width="1"/>

    <g transform="translate(57 355)">
      <circle cx="13" cy="13" r="12" fill="#202124"/>
      <path d="M8 17 C7 15 7 11 9 9 C10 7 12 7 13 8 C14 7 17 7 18 9 C20 11 20 15 18 17 C17 18 16 19 16 21 L10 21 C10 19 9 18 8 17 Z" fill="#fff"/>
      <text x="38" y="19" fill="#3d9144" font-size="17">GitHub</text>

      <rect x="149" y="5" width="25" height="17" rx="2" fill="#3d9144"/>
      <path d="M151 7 L161.5 15 L172 7" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="187" y="19" fill="#3d9144" font-size="17">Email</text>

      <path d="M299 14 L310 3 C314 -1 321 6 317 10 L306 21 C302 25 295 18 299 14 Z M306 14 L312 8" fill="none" stroke="#3d9144" stroke-width="3" stroke-linecap="round"/>
      <text x="333" y="19" fill="#3d9144" font-size="17">Website</text>
    </g>
  </g>

  <image x="665" y="20" width="470" height="470" href="frog.png" xlink:href="frog.png" preserveAspectRatio="xMidYMid meet"/>

  <g transform="translate(1060 18)" filter="url(#small-shadow)">
    <path d="M9 1 H87 C98 1 107 10 107 21 V66 C107 77 98 86 87 86 H54 L31 106 V86 H9 C-2 86 -11 77 -11 66 V21 C-11 10 -2 1 9 1 Z" fill="#fff" stroke="#dfe2e3" stroke-width="2"/>
    <path d="M18 31 C18 19 34 16 42 27 C50 16 66 19 66 31 C66 42 53 50 42 59 C31 50 18 42 18 31 Z" fill="#7bcc45"/>
  </g>

  <g fill="#74c844">
    <rect x="673" y="95" width="8" height="28"/>
    <rect x="663" y="105" width="28" height="8"/>
    <rect x="644" y="138" width="7" height="20"/>
    <rect x="638" y="144" width="19" height="7"/>
  </g>
</svg>
